services:
  api:
    build: {context: ., dockerfile: Dockerfile.api}
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATA_DIR: /app/data
      DATABASE_PATH: /app/state/trustmesh.sqlite3
      LLM_PROVIDER: ${LLM_PROVIDER:-mock/local}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      TRUSTMESH_API_KEYS: ${TRUSTMESH_API_KEYS:-[]}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-auto}
      MODEL_DOWNLOADS_ALLOWED: ${MODEL_DOWNLOADS_ALLOWED:-false}
      VECTOR_INDEX_DIR: /app/state/vector-index
      RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
      CLAIM_NLI_ENABLED: ${CLAIM_NLI_ENABLED:-false}
      CLAIM_NLI_MODEL: ${CLAIM_NLI_MODEL:-cross-encoder/nli-deberta-v3-base}
      CLAIM_NLI_THRESHOLD: ${CLAIM_NLI_THRESHOLD:-0.72}
      BANDIT_ROUTING_ENABLED: ${BANDIT_ROUTING_ENABLED:-false}
      LANGGRAPH_ENABLED: ${LANGGRAPH_ENABLED:-true}
      TRACING_PROVIDER: ${TRACING_PROVIDER:-disabled}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}
    ports: ['8000:8000']
    volumes:
      - trustmesh_state:/app/state
    healthcheck: {test: ['CMD','python','-c',"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 10s, timeout: 3s, retries: 5}
  ui:
    build: {context: ., dockerfile: Dockerfile.ui}
    environment:
      OPSPILOT_API_URL: http://api:8000
      OPSPILOT_API_TOKEN: ${OPSPILOT_API_TOKEN:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      STREAMLIT_SERVER_MAX_UPLOAD_SIZE: ${MAX_UPLOAD_MB:-10}
    ports: ['8501:8501']
    depends_on: {api: {condition: service_healthy}}

volumes:
  trustmesh_state:
